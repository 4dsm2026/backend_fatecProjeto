name: CI
on:
push:
branches: [ main ]
pull_request:
branches: [ main ]
jobs:
build:
runs-on: ubuntu-latest
services:
mysql:
image: mysql:8
env:
MYSQL_ROOT_PASSWORD: root
MYSQL_DATABASE: workflow_fatec
ports: ["3306:3306"]
options: >-
--health-cmd "mysqladmin ping -h localhost -proot"
--health-interval 10s
--health-timeout 5s
--health-retries 5
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: 20
- name: Install pnpm
run: npm i -g pnpm
- name: Install deps
run: pnpm i --frozen-lockfile
- name: Generate Prisma client
run: pnpm prisma:generate
env:
DATABASE_URL: mysql://root:root@127.0.0.1:3306/workflow_fatec
- name: Typecheck
run: pnpm typecheck
- name: Lint
run: pnpm lint
- name: Test
run: pnpm test
env:
DATABASE_URL: mysql://root:root@127.0.0.1:3306/workflow_fatec