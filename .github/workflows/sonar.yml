name: SonarQube

on:
  push:
    branches: [main, Fiat-Uno]
  pull_request:
    branches: [main, Fiat-Uno]

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/workflow_fatec
      JWT_ACCESS_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:unit

      - name: Integration tests with coverage
        run: pnpm test:integration

      - name: Check Sonar project key
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "Configure a variável SONAR_PROJECT_KEY no repositório."
            exit 1
          fi

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
