sonar.projectKey=REPLACE_WITH_SONAR_PROJECT_KEY
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.exclusions=**/node_modules/**,dist/**,docs/**,coverage/**,prisma/migrations/**
sonar.coverage.exclusions=src/server.ts,src/**/*.d.ts,tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info